# AI-Assisted.
# Runs the dist-ai STATIC website-consistency lane against this site: every
# internal link resolves, the footer carries the uniform family links, prose
# capitalizes "Open Source"/"Free Software", the review-status banner never claims
# a green "working" state, and first-party SVGs carry no active content. The checks
# live in org-ai-assisted/dist-ai (too high-volume for human review); here we check
# out both repos as siblings and point the static-check wrapper at this checkout.
# debian:trixie-slim matches the dist-ai CI runtime.
#
# STATIC lane only: the full website-tests wrapper also drives the Playwright
# browser lanes (their own workflows: website-mobile / website-width) and the
# Qubes-sandbox lanes (lint/vnu/lighthouse/axe), neither of which a GitHub runner
# has -- so it would exit 78 (env-unmet) here and cannot gate CI.
name: web-consistency-tests

on:
  ## Pages serves this branch directly, so a push IS a deploy: it has to be
  ## checked on push, not only on PRs, which the site is not developed through.
  push:
    paths:
      - '**/*.html'
      - 'style.css'
      - '.github/workflows/web-consistency-tests.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'style.css'
      - '.github/workflows/web-consistency-tests.yml'

permissions:
  contents: read

## One run per ref; a superseded push has nothing to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-consistency-tests:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install tools
        run: apt-get update && apt-get install --yes --no-install-recommends git python3 python3-pil python3-defusedxml python3-yaml ca-certificates

      - name: Check out output-lies.github.io
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: output-lies
          ## The next step executes dist-ai's code in this workspace. Checkout
          ## otherwise leaves this repo's GITHUB_TOKEN in .git/config, where
          ## that foreign code can read it. Nothing here pushes.
          persist-credentials: false

      - name: Check out dist-ai (test suite)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Run static website-consistency checks
        run: ./dist-ai/ci/website-static-check.sh "${GITHUB_WORKSPACE}/output-lies"
