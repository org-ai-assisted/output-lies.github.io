# AI-Assisted.
# Runs the dist-ai website-tests suite against this site: every internal link
# resolves, the footer carries the uniform family links, prose capitalizes
# "Open Source"/"Free Software", and the review-status banner never claims a
# green "working" state. The suite lives in org-ai-assisted/dist-ai (too
# high-volume for human review); here we check out both repos as siblings and
# point OUTPUT_LIES_REPO at this checkout. debian:trixie-slim matches the dist-ai
# CI runtime.
name: web-consistency-tests

on:
  # Push testing + the gated deploy are in pages.yml; this covers PRs.
  pull_request:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    paths:
      - '**/*.html'
      - 'style.css'
      - '.github/workflows/web-consistency-tests.yml'

permissions:
  contents: read

## One run per ref; a superseded push has nothing to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-consistency-tests:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install tools
        run: apt-get update && apt-get install --yes --no-install-recommends git python3 ca-certificates

      - name: Check out output-lies.github.io
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: output-lies

      - name: Check out dist-ai (test suite)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai

      - name: Run website-tests
        run: OUTPUT_LIES_REPO="${GITHUB_WORKSPACE}/output-lies" bash dist-ai/usr/bin/website-tests
